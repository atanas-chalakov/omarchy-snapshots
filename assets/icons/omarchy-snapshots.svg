<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="50%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow Neon Gradient -->
    <linearGradient id="arrowGrad" x1="130" y1="120" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Platter Gradients -->
    <linearGradient id="bottomPlatterGrad" x1="144" y1="320" x2="368" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131c26"/>
      <stop offset="50%" stop-color="#0d151f"/>
      <stop offset="100%" stop-color="#0a2a24"/>
    </linearGradient>

    <linearGradient id="midPlatterGrad" x1="144" y1="270" x2="368" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152232"/>
      <stop offset="50%" stop-color="#0e1a27"/>
      <stop offset="100%" stop-color="#072d42"/>
    </linearGradient>

    <linearGradient id="topPlatterGrad" x1="144" y1="210" x2="368" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2f44"/>
      <stop offset="50%" stop-color="#083a52"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cylBottom" x1="144" y1="330" x2="368" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09121a"/>
      <stop offset="20%" stop-color="#1a2e2b"/>
      <stop offset="80%" stop-color="#1a2e2b"/>
      <stop offset="100%" stop-color="#09121a"/>
    </linearGradient>

    <linearGradient id="cylMid" x1="144" y1="280" x2="368" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09131f"/>
      <stop offset="20%" stop-color="#1e3247"/>
      <stop offset="80%" stop-color="#1e3247"/>
      <stop offset="100%" stop-color="#09131f"/>
    </linearGradient>

    <linearGradient id="cylTop" x1="144" y1="230" x2="368" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061c28"/>
      <stop offset="20%" stop-color="#0e4e6e"/>
      <stop offset="80%" stop-color="#0e4e6e"/>
      <stop offset="100%" stop-color="#061c28"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container with Shadow -->
  <g filter="url(#shadowFilter)">
    <rect x="36" y="36" width="440" height="440" rx="108" ry="108" fill="url(#bgGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
    <rect x="39" y="39" width="434" height="434" rx="105" ry="105" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  </g>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="170" fill="url(#ambientGlow)"/>

  <!-- High-tech Viewfinder / Snapshot Framing Marks -->
  <g stroke="#00f0ff" stroke-opacity="0.32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 88 116 L 88 92 C 88 90 90 88 92 88 L 116 88"/>
    <path d="M 396 88 L 420 88 C 422 88 424 90 424 92 L 424 116"/>
    <path d="M 88 396 L 88 420 C 88 422 90 424 92 424 L 116 424"/>
    <path d="M 396 424 L 420 424 C 422 424 424 422 424 420 L 424 396"/>
  </g>

  <!-- Subtle Center Crosshairs -->
  <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="72" x2="256" y2="86"/>
    <line x1="256" y1="426" x2="256" y2="440"/>
    <line x1="72" y1="256" x2="86" y2="256"/>
    <line x1="426" y1="256" x2="440" y2="256"/>
  </g>

  <!-- ==================== BTRFS / STORAGE PLATTERS ==================== -->
  <g transform="translate(0, 22)">
    <!-- BOTTOM PLATTER (Layer 1 - Baseline Snapshot / Golden Image) -->
    <g>
      <!-- Cylinder side -->
      <path d="M 144 330 A 112 30 0 0 0 368 330 L 368 344 A 112 30 0 0 1 144 344 Z" fill="url(#cylBottom)"/>
      <path d="M 144 344 A 112 30 0 0 0 368 344" fill="none" stroke="#10b981" stroke-opacity="0.45" stroke-width="2"/>
      <!-- Top Face -->
      <ellipse cx="256" cy="330" rx="112" ry="30" fill="url(#bottomPlatterGrad)" stroke="#1e3a34" stroke-width="1.5"/>
      <ellipse cx="256" cy="330" rx="80" ry="21" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="14 7"/>
    </g>

    <!-- MIDDLE PLATTER (Layer 2 - Incremental Snapshot) -->
    <g>
      <!-- Cylinder side -->
      <path d="M 144 280 A 112 30 0 0 0 368 280 L 368 294 A 112 30 0 0 1 144 294 Z" fill="url(#cylMid)"/>
      <path d="M 144 294 A 112 30 0 0 0 368 294" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
      <!-- Top Face -->
      <ellipse cx="256" cy="280" rx="112" ry="30" fill="url(#midPlatterGrad)" stroke="#22425a" stroke-width="1.5"/>
      <ellipse cx="256" cy="280" rx="80" ry="21" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="16 8"/>
    </g>

    <!-- TOP PLATTER (Layer 3 - Active Live Subvolume) -->
    <g>
      <!-- Cylinder side -->
      <path d="M 144 230 A 112 30 0 0 0 368 230 L 368 244 A 112 30 0 0 1 144 244 Z" fill="url(#cylTop)"/>
      <path d="M 144 244 A 112 30 0 0 0 368 244" fill="none" stroke="#00f0ff" stroke-opacity="0.8" stroke-width="2"/>
      <!-- Top Face -->
      <ellipse cx="256" cy="230" rx="112" ry="30" fill="url(#topPlatterGrad)" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.8"/>
      
      <!-- Concentric Circuit Tracks on Top Platter -->
      <ellipse cx="256" cy="230" rx="84" ry="22" fill="none" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1.5"/>
      <ellipse cx="256" cy="230" rx="54" ry="14" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
      
      <!-- Central Spindle Core -->
      <ellipse cx="256" cy="230" rx="22" ry="6.5" fill="#06131c" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="256" cy="230" r="5" fill="#00f0ff" filter="url(#neonGlow)"/>
    </g>
  </g>

  <!-- ==================== SWEEPING TIME-RESTORE ARROW ==================== -->
  <g filter="url(#neonGlow)">
    <!-- Arc Path: sweeping gracefully around the platters -->
    <path d="M 370 342 C 420 286 422 198 382 144 C 338 88 246 82 176 122 C 150 137 130 159 116 186"
          fill="none"
          stroke="url(#arrowGrad)"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Sharp Arrowhead pointing counter-clockwise (reverting/restoring) -->
    <path d="M 88 174 L 126 196 L 124 148 Z"
          fill="url(#arrowGrad)"
          stroke="#00f0ff"
          stroke-width="2.5"
          stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Orbit Beads (Data states preserved in time) -->
  <circle cx="398" cy="184" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="328" cy="102" r="4.5" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="236" cy="94" r="5" fill="#00f0ff" filter="url(#neonGlow)"/>

  <!-- Origin / Anchor Node (Emerald Baseline Checkpoint) -->
  <g filter="url(#neonGlow)">
    <circle cx="370" cy="342" r="8" fill="#10b981"/>
    <circle cx="370" cy="342" r="15" fill="none" stroke="#10b981" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>

</svg>
